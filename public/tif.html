<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Đổi tiêu đề phù hợp với dự án NASA Space Apps của nhóm bạn -->
    <title>NASA Space Apps - Bản đồ TIF</title>

    <!-- Thư viện Leaflet cốt lõi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Thư viện đọc GeoTIFF -->
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
        }
        #map { 
            height: 100vh; /* Chiều cao bản đồ phủ kín màn hình */
            width: 100vw; 
        } 
    </style>
</head>
<body>
    
    <!-- Nơi chứa bản đồ -->
    <div id="map"></div>

    <script>
        // 1. Khởi tạo bản đồ (tọa độ tạm thời, sẽ tự zoom đến TIF sau)
        var map = L.map('map').setView([0, 0], 2);

        // 2. Lớp bản đồ nền (Đã fix lỗi API KEY)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 3. Tích hợp file TIF
        // QUAN TRỌNG: Thay đổi tên file này thành đúng tên file .tif mà bạn đang có trong thư mục
        var tiff_url = "ten_file_cua_ban.tif"; 

        fetch(tiff_url)
          .then(response => response.arrayBuffer())
          .then(arrayBuffer => {
            parseGeoraster(arrayBuffer).then(georaster => {
              var tiffLayer = new GeoRasterLayer({
                  georaster: georaster,
                  opacity: 0.8, // Độ mờ của lớp TIF (0.0 đến 1.0)
                  resolution: 256 // Độ phân giải render
              });
              
              tiffLayer.addTo(map);
              
              // Tự động zoom đến khu vực có dữ liệu TIF
              map.fitBounds(tiffLayer.getBounds());
            });
          })
          .catch(error => {
              console.error("Lỗi khi load file TIF. Đảm bảo bạn đang chạy qua Local Server (như Live Server). Chi tiết lỗi:", error);
              alert("Không thể tải file TIF. Hãy nhấn F12 mở tab Console để xem chi tiết.");
          });
    </script>
</body>
</html>
